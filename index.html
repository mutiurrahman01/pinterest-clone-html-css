<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <h2>Pinterest</h2>
        </div>

        <div class="search-section">
            <button class="explore-btn">Explore</button>
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input  type="text" placeholder="Search...">
            </div>

        </div>

        <div class="nav-links">
            <li><a href="">About</li></a>
            <li><a href="">Businesses</li></a>
            <li><a href="">Create</li></a>
            <li><a href="">News</li></a>
        </div>

        <div class="auth-btns">
            <button class="login">Login</button>
            <button class="signup">Signup</button>
        </div>

        <div class="hamburger">
            <i class="fa fa-bars"></i>
        </div>

    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>Get Your Next <span>weeknight dinner idea</span></h1>
        </div>
    </section>

    <div class="gallery">
        <h1>Pinterest Gallery</h1>
        <div class="pin-container">
            <div class="pin">
                <img src="https://picsum.photos/300/500" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/350" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/450" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/460" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/520" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/380" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/400" alt="">
            </div>
            <div class="pin">
                <img src="https://picsum.photos/300/450" alt="">
            </div>
        </div>
    </div>
</body>

</html>
